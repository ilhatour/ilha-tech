  function b64(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0)})}
  async function dec(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c)));
  }
  var f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn'),busy=false;
  f.addEventListener('submit',async function(e){
    e.preventDefault(); if(busy) return; busy=true; err.textContent=''; btn.textContent='Abrindo…';
    try{ var html=await dec(document.getElementById('pw').value.trim().toLowerCase());
      document.open(); document.write(html); document.close();
    }catch(_){ err.textContent='Senha errada. Confira e tente de novo.'; btn.textContent='Abrir'; busy=false; }
  });
  btn.addEventListener('touchend',function(e){ e.preventDefault(); f.requestSubmit(); });
})();
