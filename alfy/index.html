<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0124">
<title>ALFY · Mapa de Rotas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0124'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23C79BFF' stroke-width='3'/%3E%3Ccircle cx='41' cy='24' r='5' fill='%234ADE80'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="alfy.css?v=1">
</head>
<body>
<canvas id="ceu" aria-hidden="true"></canvas>
<div class="palco">

  <!-- Entrada: terminal de acesso da cabine -->
  <main id="tela-entrada" class="entrada">
    <form class="terminal" id="form-entrada" autocomplete="off">
      <div class="topo">
        <div class="radar" aria-hidden="true"><i></i></div>
        <div class="marca">ALFY<small>Mapa de Rotas · Ilha Tech</small></div>
      </div>
      <div class="feed" id="feed" aria-live="polite"><div>sistemas de bordo ligados</div><div>aguardando código de acesso</div></div>
      <div class="campo">
        <label for="codigo">Código de acesso</label>
        <input id="codigo" class="entrada-codigo" inputmode="text" spellcheck="false" placeholder="cole aqui o seu código">
      </div>
      <button class="btn btn-cta btn-larga" type="submit">Entrar no comando</button>
      <p class="erro" id="erro-entrada"></p>
      <p class="nota-entrada">O código vem no seu link pessoal do ALFY. Quem tem o link entra direto.</p>
    </form>
  </main>

  <!-- Painel -->
  <div id="tela-painel" hidden>
    <header class="barra">
      <div class="barra-l1">
        <div class="marca">ALFY<small>Mapa de Rotas</small></div>
        <div class="quem"><b id="eu-nome"></b><span class="selo" id="eu-papel"></span></div>
        <div class="instrumentos">
          <div class="inst"><span>Rotas</span><b id="i-abertas">0</b></div>
          <div class="inst alerta"><span>Vencidas</span><b id="i-vencidas">0</b></div>
          <div class="inst"><span>Bordo</span><b id="i-hora">--:--</b></div>
          <span class="vivo" id="vivo">ao vivo</span>
          <button class="btn" type="button" id="sair">Sair</button>
        </div>
      </div>
      <nav class="abas" role="tablist">
        <button class="aba" role="tab" data-vista="lista" aria-selected="true">Lista</button>
        <button class="aba" role="tab" data-vista="kanban" aria-selected="false">Kanban</button>
        <button class="aba" role="tab" data-vista="pautas" aria-selected="false" id="aba-pautas">Pautas <span class="n" id="n-pautas"></span></button>
        <button class="aba" role="tab" data-vista="sistema" aria-selected="false" id="aba-sistema">Como funciona</button>
      </nav>
    </header>

    <main class="conteudo">
      <div class="filtros" id="filtros">
        <input type="search" id="busca" placeholder="Buscar rota, número ou assunto">
        <select id="f-pessoa" aria-label="Pessoa"></select>
        <select id="f-frente" aria-label="Frente"></select>
        <button class="chip" type="button" id="f-vencidas" aria-pressed="false">Só vencidas</button>
        <button class="chip" type="button" id="f-minhas" aria-pressed="false">Só as minhas</button>
      </div>
      <section id="vista-lista"></section>
      <section id="vista-kanban" hidden><div class="kanban" id="kanban"></div></section>
      <section id="vista-pautas" hidden></section>
      <section id="vista-sistema" hidden></section>
    </main>
    <button class="btn btn-cta fab" type="button" id="nova-ideia">+ Ideia</button>
  </div>
</div>

<div class="fundo-modal" id="modal" hidden></div>
<div class="aviso" id="aviso" hidden role="status"></div>
<script src="alfy.js?v=2"></script>
</body>
</html>
