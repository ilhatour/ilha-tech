<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1F23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALFY">
<title>ALFY · Mapa de Rotas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323282D'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E🐙%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="alfy.css?v=28">
</head>
<body>

<main id="tela-entrada" class="entrada" hidden>
  <form class="placa rebites" id="form-entrada" autocomplete="off">
    <div class="marca"><span class="polvo">🐙</span><div><b>ALFY</b><small>Mapa de Rotas</small></div></div>
    <div id="bloco-senha" style="display:flex;flex-direction:column;gap:10px">
      <label for="usuario">Usuário</label>
      <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="seu usuário">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="sua senha">
    </div>
    <div id="bloco-codigo" hidden style="display:flex;flex-direction:column;gap:10px">
      <label for="codigo">Código de acesso</label>
      <input id="codigo" spellcheck="false" placeholder="cole aqui o seu código">
    </div>
    <button class="cta" type="submit">Entrar</button>
    <p class="erro" id="erro-entrada"></p>
    <p class="nota">Ainda não tem usuário? Peça o link de acesso para a Gestão de Pessoas. Esqueceu a senha? Peça um link novo. <button class="mini" type="button" data-acao="entrar-codigo">Entrar com código</button></p>
  </form>
</main>

<div class="app" id="tela-painel" hidden>
  <aside class="lateral">
    <div class="placa rebites marca"><span class="polvo">🐙</span><div><b>ALFY</b><small>Mapa de Rotas</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="placa eu"><div class="avatar" id="eu-av"></div><div class="quem"><b id="eu-nome"></b><span id="eu-papel"></span></div></div>
  </aside>
  <div class="principal">
    <header class="topo">
      <div class="topo-cel"><div class="placa rebites" style="padding-left:18px"><span>🐙</span><b>ALFY</b></div><span class="titulo" id="titulo-cel"></span><span id="alterna-cel"></span><div class="avatar" id="eu-av-cel" role="button" tabindex="0" aria-label="Eu"></div></div>
      <div class="topo-l1" id="topo-l1"></div>
      <div class="filtros" id="filtros"></div>
    </header>
    <div class="medidores" id="medidores"></div>
    <div class="prio-faixa" id="prio-faixa" hidden></div>
    <main class="conteudo" id="conteudo"><div class="carregando">Carregando…</div></main>
  </div>
</div>
<nav class="barra-baixo" id="barra-baixo" hidden></nav>
<button class="cta fab" id="fab" type="button" hidden>＋ Nova rota</button>
<div id="camada"></div>
<div class="aviso" id="aviso" hidden role="status"></div>
<script src="alfy.js?v=45"></script>
</body>
</html>
